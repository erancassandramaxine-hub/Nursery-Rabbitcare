<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Test — Rabbit Nursery</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: monospace; padding: 24px; background: #0f0f0f; color: #e0e0e0; }
    h2 { margin-bottom: 16px; color: #fff; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    label { width: 120px; color: #aaa; }
    input { background: #1e1e1e; border: 1px solid #444; color: #e0e0e0; padding: 6px 10px; border-radius: 4px; width: 120px; }
    button { padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 14px; }
    #btnConnect    { background: #2563eb; color: #fff; }
    #btnDisconnect { background: #555; color: #fff; }
    #btnEmit       { background: #16a34a; color: #fff; }
    #btnClear      { background: #333; color: #aaa; }
    #status { margin: 12px 0; font-weight: bold; }
    #status.connected    { color: #4ade80; }
    #status.disconnected { color: #f87171; }
    #log { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; font-size: 13px; }
    .log-entry { margin-bottom: 6px; }
    .log-entry .ts  { color: #6b7280; margin-right: 8px; }
    .log-entry.recv { color: #4ade80; }
    .log-entry.sent { color: #60a5fa; }
    .log-entry.info { color: #facc15; }
    .log-entry.err  { color: #f87171; }
  </style>
</head>
<body>

<h2>Rabbit Nursery — WebSocket Tester</h2>

<div class="row">
  <label>Server URL</label>
  <input id="url" value="http://localhost:4000" style="width:200px" />
  <button id="btnConnect">Connect</button>
  <button id="btnDisconnect">Disconnect</button>
</div>

<div id="status" class="disconnected">● Disconnected</div>

<hr style="border-color:#333;margin:16px 0" />

<h3 style="margin-bottom:12px">Emit: <code>sensor-data</code></h3>
<div class="row">
  <label>temperature</label>
  <input id="temperature" type="number" step="0.1" value="24.5" />
</div>
<div class="row">
  <label>humidity</label>
  <input id="humidity" type="number" step="0.1" value="62.3" />
</div>
<div class="row">
  <button id="btnEmit">Emit sensor-data</button>
</div>

<hr style="border-color:#333;margin:16px 0" />

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
  <strong>Log</strong>
  <button id="btnClear">Clear</button>
</div>
<div id="log"></div>

<script>
  let socket = null;

  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');

  function log(msg, type = 'info') {
    const ts = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerHTML = `<span class="ts">${ts}</span>${msg}`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(connected) {
    statusEl.textContent = connected ? '● Connected' : '● Disconnected';
    statusEl.className = connected ? 'connected' : 'disconnected';
  }

  document.getElementById('btnConnect').addEventListener('click', () => {
    if (socket && socket.connected) return;
    const url = document.getElementById('url').value.trim();
    socket = io(url, { transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
      setStatus(true);
      log(`Connected — socket id: ${socket.id}`, 'info');
    });

    socket.on('disconnect', (reason) => {
      setStatus(false);
      log(`Disconnected: ${reason}`, 'err');
    });

    socket.on('connect_error', (err) => {
      log(`Connection error: ${err.message}`, 'err');
    });

    socket.on('temperature-humidity', (data) => {
      log(`[temperature-humidity] ${JSON.stringify(data)}`, 'recv');
    });
  });

  document.getElementById('btnDisconnect').addEventListener('click', () => {
    if (socket) { socket.disconnect(); socket = null; }
  });

  document.getElementById('btnEmit').addEventListener('click', () => {
    if (!socket || !socket.connected) {
      log('Not connected', 'err');
      return;
    }
    const payload = {
      temperature: parseFloat(document.getElementById('temperature').value),
      humidity: parseFloat(document.getElementById('humidity').value),
    };
    socket.emit('sensor-data', payload);
    log(`[sensor-data] sent → ${JSON.stringify(payload)}`, 'sent');
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    logEl.innerHTML = '';
  });
</script>

</body>
</html>
